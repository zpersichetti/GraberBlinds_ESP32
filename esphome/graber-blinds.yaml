# ------------------------------------------- live position sensors
sensor:
  - platform: template
    name: "Blind 1 Bottom"
    id: blind1_bottom
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Blind 1 Middle"
    id: blind1_middle
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Blind 2 Bottom"
    id: blind2_bottom
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Blind 2 Middle"
    id: blind2_middle
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Blind 3 Bottom"
    id: blind3_bottom
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Blind 3 Middle"
    id: blind3_middle
    unit_of_measurement: "%"
    accuracy_decimals: 0

# ------------------------------------------- position sliders (one per rail)
# NOTE ON COUPLING: moving one rail forces the other to a default — moving the
# BOTTOM sends the top to 100; moving the MIDDLE sends the bottom to 0. Expected;
# the blind only supports one rail at an arbitrary position at a time.
cover:
  - platform: template
    name: "Blind 1 Bottom"
    id: blind1_bottom_cover
    device_class: shade
    has_position: true
    optimistic: false
    lambda: |-
      if (!id(blind1_bottom).has_state()) return {};
      return id(blind1_bottom).state / 100.0f;   // 0.0=closed(0%) .. 1.0=open(100%)
    position_action:
      - globals.set:
          id: blind1_rail
          value: "0"
      - globals.set:
          id: blind1_target
          value: !lambda "return (int)(pos * 100.0f);"
      - ble_client.connect: blind1
    open_action:
      - globals.set:
          id: blind1_rail
          value: "0"
      - globals.set:
          id: blind1_target
          value: "100"
      - ble_client.connect: blind1
    close_action:
      - globals.set:
          id: blind1_rail
          value: "0"
      - globals.set:
          id: blind1_target
          value: "0"
      - ble_client.connect: blind1
    stop_action:
      - ble_client.disconnect: blind1
  - platform: template
    name: "Blind 1 Middle"
    id: blind1_middle_cover
    device_class: shade
    has_position: true
    optimistic: false
