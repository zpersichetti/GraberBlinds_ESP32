# Graber/Brel TDBU blinds — ESPHome BLE bridge (3 blinds)
# Board: Seeed Studio XIAO ESP32-S3
# See notes/protocol.md. Connect-on-demand so the phone app still works.
# Position is read passively from advertising; commands connect briefly then disconnect.

esphome:
  name: graber-blind
  friendly_name: graber-blind

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: graber-blind Fallback Hotspot
    password: !secret ap_password
  output_power: 8.5dB

captive_portal:


# ------------------------------------------- passive position (no connection)
esp32_ble_tracker:
  on_ble_manufacturer_data_advertise:
    - mac_address: 14:2D:41:DD:0E:60
      manufacturer_id: "0000"
      then:
        - lambda: |-
            if (x.size() < 4) return;
            if (x[0] != 0x44 && x[0] != 0x46) return;
            id(blind1_bottom).publish_state(x[2]);
            id(blind1_middle).publish_state(x[3]);
    - mac_address: 14:2D:41:DD:0E:E7
      manufacturer_id: "0000"
      then:
        - lambda: |-
            if (x.size() < 4) return;
            if (x[0] != 0x44 && x[0] != 0x46) return;
            id(blind2_bottom).publish_state(x[2]);
            id(blind2_middle).publish_state(x[3]);
    - mac_address: 14:2D:41:DD:0E:5C
      manufacturer_id: "0000"
      then:
        - lambda: |-
            if (x.size() < 4) return;
            if (x[0] != 0x44 && x[0] != 0x46) return;
            id(blind3_bottom).publish_state(x[2]);
            id(blind3_middle).publish_state(x[3]);

globals:
  - id: blind1_rail
    type: int
    initial_value: "0"
  - id: blind1_target
    type: int
    initial_value: "0"
  - id: blind2_rail
    type: int
    initial_value: "0"
  - id: blind2_target
    type: int
    initial_value: "0"
  - id: blind3_rail
    type: int
    initial_value: "0"
  - id: blind3_target
    type: int
    initial_value: "0"

# ------------------------------------------- command clients (connect-on-demand)
ble_client:
  - mac_address: 14:2D:41:DD:0E:60    # Blind 1
    id: blind1
    auto_connect: false
    on_connect:
      then:
        - delay: 450ms
        - ble_client.ble_write:
            id: blind1
            service_uuid: de8a5aac-a99b-c315-0c80-60b63a869124
            characteristic_uuid: 5b026510-4088-c297-46d8-be6cb63a8691
            # AUTH TOKEN for Blind 1 (14:2D:41:DD:0E:60) — PLACEHOLDER.
            # Each blind has its own token; capture yours (see README) and put
            # the 7 ASCII digits here as bytes, e.g. "1234567" -> [0x31,...,0x37].
            value: [0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30]
        - delay: 150ms
        - if:
            condition:
              lambda: "return id(blind1_rail) == 0;"
            then:
              - ble_client.ble_write:
                  id: blind1
                  service_uuid: de8a5aac-a99b-c315-0c80-60b63a869124
                  characteristic_uuid: 3ead2b49-abbc-4602-ac80-54d4b5687bac
                  value: !lambda "return {(uint8_t) id(blind1_target)};"
              - delay: 150ms
              - ble_client.ble_write:
                  id: blind1
                  service_uuid: de8a5aac-a99b-c315-0c80-60b63a869124
                  characteristic_uuid: 5b026510-4088-c297-46d8-be6cb63a8691
                  value: [0x14]
        - if:
            condition:
              lambda: "return id(blind1_rail) == 1;"
            then:
              - ble_client.ble_write:
                  id: blind1
                  service_uuid: 375b4079-d234-4631-9592-65c87174410c
                  characteristic_uuid: a506fbb1-9777-4e43-aa13-67d1bab6c0a1
                  value: !lambda "return {(uint8_t) id(blind1_target)};"
              - delay: 150ms
              - ble_client.ble_write:
                  id: blind1
                  service_uuid: 375b4079-d234-4631-9592-65c87174410c
                  characteristic_uuid: bb27521d-2fd4-4187-af9f-5d0780238d7e
                  value: [0x14]
        - delay: 400ms
        - ble_client.disconnect: blind1
  - mac_address: 14:2D:41:DD:0E:E7    # Blind 2
    id: blind2
    auto_connect: false
    on_connect:
      then:
        - delay: 450ms
        - ble_client.ble_write:
            id: blind2
            service_uuid: de8a5aac-a99b-c315-0c80-60b63a869124
            characteristic_uuid: 5b026510-4088-c297-46d8-be6cb63a8691
            # AUTH TOKEN for Blind 2 (14:2D:41:DD:0E:E7) — PLACEHOLDER.
            # Each blind has its own token; capture yours (see README) and put
            # the 7 ASCII digits here as bytes, e.g. "1234567" -> [0x31,...,0x37].
            value: [0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30]
        - delay: 150ms
        - if:
            condition:
              lambda: "return id(blind2_rail) == 0;"
            then:
              - ble_client.ble_write:
                  id: blind2
                  service_uuid: de8a5aac-a99b-c315-0c80-60b63a869124
                  characteristic_uuid: 3ead2b49-abbc-4602-ac80-54d4b5687bac
                  value: !lambda "return {(uint8_t) id(blind2_target)};"
              - delay: 150ms
              - ble_client.ble_write:
                  id: blind2
                  service_uuid: de8a5aac-a99b-c315-0c80-60b63a869124
                  characteristic_uuid: 5b026510-4088-c297-46d8-be6cb63a8691
                  value: [0x14]
        - if:
            condition:
              lambda: "return id(blind2_rail) == 1;"
            then:
              - ble_client.ble_write:
                  id: blind2
                  service_uuid: 375b4079-d234-4631-9592-65c87174410c
                  characteristic_uuid: a506fbb1-9777-4e43-aa13-67d1bab6c0a1
                  value: !lambda "return {(uint8_t) id(blind2_target)};"
              - delay: 150ms
              - ble_client.ble_write:
                  id: blind2
                  service_uuid: 375b4079-d234-4631-9592-65c87174410c
                  characteristic_uuid: bb27521d-2fd4-4187-af9f-5d0780238d7e
                  value: [0x14]
        - delay: 400ms
        - ble_client.disconnect: blind2
  - mac_address: 14:2D:41:DD:0E:5C    # Blind 3
    id: blind3
    auto_connect: false
    on_connect:
      then:
        - delay: 450ms
        - ble_client.ble_write:
            id: blind3
            service_uuid: de8a5aac-a99b-c315-0c80-60b63a869124
