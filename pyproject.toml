[project]
name = "graber-ble-map"
version = "0.1.0"
description = "Closed-loop BLE reverse-engineering harness for Graber/Brel blind motors"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "typer>=0.12",
    "numpy>=1.26",
    # Use opencv-python-headless on a server with no display.
    # Swap to opencv-python if you want cv2.imshow debugging.
    "opencv-python>=4.9",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
